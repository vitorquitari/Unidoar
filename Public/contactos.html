<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto — Unidoar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
   

    <style>
        :root {
            --primary: #3498db;
            --primary-dark: #2980b9;
            --text: #333;
            --text-light: #666;
              background: linear-gradient(135deg, rgba(52, 152, 219, 0.05) 0%, rgba(46, 204, 113, 0.05) 100%);
            --border: #e0e0e0;
            --shadow: 0 8px 30px rgba(52, 152, 219, 0.12);
            --radius: 12px;
            --font: 'Poppins', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background-color: #0c253b;
            color: var(--text);
            line-height: 1.6;
        }

       
       

        /* ===== FORMULÁRIO DE CONTACTO ===== */
        main {
            max-width: 500px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        .form-card {
            background: linear-gradient(135deg, rgba(52, 152, 219, 0.05) 0%, rgba(46, 204, 113, 0.05) 100%);
            padding: 2.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
        }

        .form-card h2 {
            color: var(--primary);
            font-family: var(--font);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .form-card p {
            color: var(--text-light);
            font-family: var(--font);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .campo-formulario {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .campo-formulario label {
            display: block;
            font-family: var(--font);
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text);
            margin-bottom: 0.4rem;
        }

        .campo-form,
        .text-form {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-family: var(--font);
            font-size: 1rem;
            color: var(--text);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .campo-form:focus,
        .text-form:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
        }

        .text-form {
            min-height: 120px;
            resize: vertical;
        }

        .form-card button {
            width: 100%;
            height: 50px;
            background-color: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: var(--font);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.25);
            margin-top: 0.5rem;
        }

        .form-card button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.35);
        }

        /* ===== RODAPÉ ===== */
        footer {
            text-align: center;
            padding: 2rem;
            background-color: #0c253b;
            color: #3498db;
            font-family: var(--font);
            font-size: 0.9rem;
            margin-top: 4rem;
        }


.btn-voltar-container {
    text-align: center;
    margin-top: 2rem;
    padding-bottom: 2rem;
    font-family: var(--font);
}

.btn-voltar {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background-color: transparent;
    color: #3498db;
    border: 2px solid #3498db;
    padding: 0.75rem 1.5rem;
    border-radius: 50px;
    text-decoration: none;
    font-family: var(--font);
    font-weight: 600;
    font-size: 0.95rem;
    transition: all 0.3s ease;
    cursor: pointer;
}

.btn-voltar:hover {
    background-color: #3498db;
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(52, 152, 219, 0.25);
}



    </style>
</head>
<body>


    <main>
        <div class="form-card">
            <h2>Entre em contacto</h2>
            <p>Preencha os campos abaixo e responderemos brevemente.</p>

            <form>
                <div class="campo-formulario">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" class="campo-form" placeholder="O teu nome" required>
                </div>

                <div class="campo-formulario">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" class="campo-form" placeholder="o.teu@email.com" required>
                </div>

                <div class="campo-formulario">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" class="text-form" placeholder="A tua mensagem..." required></textarea>
                </div>

                <button type="submit">Enviar mensagem</button>
            </form>
        </div>
    </main>
    <div class="btn-voltar-container">
        <a href="#" onclick="history.back(); return false;" class="btn-voltar">
            ← Voltar à página anterior
        </a>
    </div>
    <footer>
        <p>© Unidoar — Plataforma de Arrecadação de Doações de Itens Materiais.</p>
    </footer>

</body>
</html>
